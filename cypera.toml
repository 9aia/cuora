# cypera — org docs/reference generation contract (see ../cypera).
# Discovered upward from the repo root; `bun run docs:gen` inside
# docs/ drives `cypera gen crate-map|cli|config` with no flags.

[crate_map]
order = ["domain", "port", "ops", "engine", "adapter", "binary"]

[crate_map.layers]
"cuora" = "engine"
"cuora-core" = "domain"
"cuora-config" = "port"
"cuora-vault" = "port"
"cuora-deploy" = "port"
"cuora-ops" = "ops"

[[crate_map.splices]]
target = "docs/explanation/architecture.md"
marker = "<!-- crate-map -->"

[crate_map.crate_api]
site = "cuora"
out = "docs/reference/crate-api.md"

[cli]
package = "cuora-driver"
bin = "tamias-driver-cuora"
prefix = ["cli", "--dir", "libraries/cuora", "--name", "cuora"]
out = "docs/reference/cli.md"

[config]
title = "Config — `cuora.toml`"
out = "docs/reference/config.md"
types = { "String" = "string", "PathBuf" = "path", "bool" = "bool", "u16" = "int", "u64" = "int", "usize" = "int", "Vec<String>" = "list", "Vec<Op>" = "op list", "BTreeMap<String, VaultConfig>" = "{name: vault}", "BTreeMap<Env, EnvRoute>" = "{env: vault|{vault}}", "BTreeMap<String, Ref>" = "{VAR: cuora://ref}", "BTreeMap<String, DeployConfig>" = "{name: target}", "Guardrails" = "table", "GuardDefault" = "\"allow\"|\"deny\"", "ServeConfig" = "table", "PdpConfig" = "table" }
field_types = { "aliases" = "{path: cuora://ref}" }

[[config.structs]]
file = "crates/cuora-core/src/config.rs"
name = "Config"
title = "Top level"
[[config.structs]]
file = "crates/cuora-core/src/config.rs"
name = "VaultConfig"
title = "`[vaults.NAME]` — a named vault backend"
[[config.structs]]
file = "crates/cuora-core/src/config.rs"
name = "EnvRouteTable"
title = "`[envs]` — env → vault routing (table form)"
[[config.structs]]
file = "crates/cuora-core/src/config.rs"
name = "DeployConfig"
title = "`[deploy.NAME]` — a write-only push target"
[[config.structs]]
file = "crates/cuora-core/src/config.rs"
name = "Guardrails"
title = "`[guardrails]` — advisory op table"
[[config.structs]]
file = "crates/cuora-core/src/config.rs"
name = "ServeConfig"
title = "`[serve]` — the `cuora serve` surface"
[[config.structs]]
file = "crates/cuora-core/src/config.rs"
name = "PdpConfig"
title = "`[serve.pdp]` — the external policy decision point"

[[config.sections]]
title = "Top level"
struct = "Config"
[[config.sections]]
title = "`[vaults.NAME]` — a named vault backend"
struct = "VaultConfig"
[[config.sections]]
title = "`[envs]` — env → vault routing (table form)"
struct = "EnvRouteTable"
[[config.sections]]
title = "`[deploy.NAME]` — a write-only push target"
struct = "DeployConfig"
[[config.sections]]
title = "`[guardrails]` — advisory op table"
struct = "Guardrails"
[[config.sections]]
title = "`[serve]` — the `cuora serve` surface"
struct = "ServeConfig"
[[config.sections]]
title = "`[serve.pdp]` — the external policy decision point"
struct = "PdpConfig"
[[config.sections]]
title = "`[envs]` route forms"
text = """
Either a bare vault name or the table above:

```toml
[envs]
dev = "local"
prod = { vault = "cloud" }
```
"""
[[config.sections]]
title = "Constraints"
text = """
- `deny_unknown_fields`: typos in field names fail the load.
- Search order: `--config` → `$CUORA_CONFIG` → `./cuora.toml` →
  `~/.config/cuora/cuora.toml`. The file is optional — no
  `cuora.toml` anywhere just means defaults (local age vault,
  `dev` env).
- Token values never live in the file — `token_env` fields name
  the env var that carries them.
- `cuora schema` emits the JSON Schema for this shape;
  `cuora check` validates a real file end-to-end.
"""

[check]
profile = "engine"
