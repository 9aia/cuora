[package]
name = "cuora-sealed"
description = "cuora sealed packs: tamias store resolution, age identity, encrypt/decrypt, and the cuora://<pack>/<secret> engine read path (tamias ADR-0004)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["cuora", "secrets"]
categories = ["development-tools"]

[dependencies]
age.workspace = true
cuora-core.workspace = true
cuora-identity.workspace = true
cuora-identity-file.workspace = true
thiserror.workspace = true
zeroize.workspace = true
# The sealed-pack manifest/store contract — `Manifest.sealed`,
# `StoreRecord`, `RECORD_FILE`. Git dep like cuora-driver's (path
# deps break fresh-clone resolution). `rev` is the org-canonical
# tamias pin (PL-032) — shared with cuora-driver's tamias-core.
tamias-core = { git = "https://github.com/9aia/tamias", rev = "5464556b58bd43ee5bb2e48e02804686e04c87da", version = "0.3" }
# The local install store — `Store`/`StoreEntry` own the
# `.tamias-store.json` walk, label spelling, and find/ambiguity
# rules this crate used to re-implement. Same git source + rev as
# tamias-core above (one tamias rev per graph).
tamias-store-local = { git = "https://github.com/9aia/tamias", rev = "5464556b58bd43ee5bb2e48e02804686e04c87da", version = "0.3" }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
